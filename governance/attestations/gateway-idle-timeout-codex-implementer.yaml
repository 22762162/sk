notes: >-
  Replaces the provider gateway's 180-second cumulative wall-clock cutoff and 75-second
  generic timeout with a 180-second read-idle timeout. Calls may run longer than 180 seconds
  while response data continues to arrive; a continuous 180 seconds without response data
  stops that attempt immediately and is not retried. Connect/write/pool timeouts remain
  bounded and transient HTTP/network failures retain the existing maximum retry count.
  Synthetic regression tests prove elapsed wall time no longer cancels a responsive retry,
  the configured read-idle timeout is 180 seconds, and an idle ReadTimeout stops after one
  attempt. Verification: 61 backend tests and 32 Brain bridge tests passed; redline,
  governance-check, prompt-symmetry, Python syntax, and diff checks passed. No .env, secret,
  real database, consultation record, manifest, or live model API was accessed. Changes to
  consult-engine/gateway.py require cross-vendor review and human signoff before merge/deploy.
  CI subsequently exposed a pre-existing Asia/Shanghai midnight-dependent synthetic test;
  the test now passes its existing 2026-09-01 event anchor explicitly as as_of, without any
  production orchestrator or divination-rule change.
